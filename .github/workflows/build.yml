# TARGET FILE PATH: .github/workflows/build.yml
# WHERE TO PUT IT: Open your 'build.yml' file on GitHub, delete 100% of its current contents, and paste this entire block over it.

name: Android Build CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate Fresh Gradle Wrapper Natively
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Longshot-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
