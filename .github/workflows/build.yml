name: Android Build CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Fresh Gradle Wrapper Engine
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and Package Debug APK
      # Changed from compileDebugKotlin to assembleDebug to package the final installer file
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Longshot-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
