name: Android Build CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Full Log Report
      # CRITICAL FIX: The --continue flag forces the compiler to look at 
      # EVERY single file and print ALL errors at once, even if one fails.
      run: ./gradlew compileDebugKotlin --continue

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Longshot-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
