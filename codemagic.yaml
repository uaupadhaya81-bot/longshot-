workflows:
  android-debug-build:
    name: Longshot Android APK Build
    instance_type: linux
    max_build_duration: 30
    scripts:
      - name: Set up gradlew permissions
        script: chmod +x gradlew
      - name: Build Android Debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      
